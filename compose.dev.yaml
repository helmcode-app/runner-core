# Local dev: open-core + VFS against a **host** git checkout.
#
# Usage:
#   1. REQUIRED — set a real host git checkout (absolute path):
#        export HOST_REPO=/Users/you/Developer/src/github.com/org/my-repo
#      or put HOST_REPO=... in runner-core/.env
#   2. Optional secrets / overrides in runner-core/.env (auto-loaded if present):
#        AGENT_PROVIDER, AGENT_API_KEY, OPENCORE_API_TOKEN, …
#   3. Start:
#        docker compose -f compose.yaml -f compose.dev.yaml up --build dev
#   4. Probe:
#        curl -s http://127.0.0.1:18080/health | jq .
#        curl -s http://127.0.0.1:18080/v1/vfs/status | jq .
#   5. iPad / Simulator Base URL:
#        http://127.0.0.1:18080          (Simulator)
#        http://<Mac-LAN-IP>:18080       (physical iPad)
#
# Notes:
#   - HOST_REPO is required. The placeholder path is not valid and will fail mount.
#   - HOST_REPO must be a git repo (contains .git).
#   - One runner instance = one repo (MAIN_REPO_PATH=/app/main_repo).
#   - Agent worktrees use a separate volume (/app/workspaces), not the host mount.
#   - Compose only pins container-layout + a few dev defaults. Everything else
#     comes from the image/config.ts defaults or from .env (see env_file).
#   - Agent sessions: SESSIONS_ENABLED=true in .env (harness installs from code defaults).
#   - Stop: docker compose -f compose.yaml -f compose.dev.yaml down

services:
  dev:
    build:
      context: .
      target: smoke
    ports:
      - "${DEV_PORT:-18080}:8080"
    # Pass through root .env without re-listing every key in `environment`.
    # Keys also listed under `environment` below win on conflict.
    env_file:
      - path: .env
        required: false
    environment:
      # ── Fixed for this compose layout (not optional) ──────────
      HELM_MODE: open-core
      HOST: 0.0.0.0
      PORT: "8080"
      VFS_ENABLED: "true"
      MAIN_REPO_PATH: /app/main_repo
      WORKSPACES_PATH: /app/workspaces

      # ── Dev defaults that differ from config.ts / image ───────
      # Terminal on for iPad WebSSH; code default is false (quiet tests).
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-true}
      TERMINAL_WORKDIR: /app/main_repo

      # Sessions: opt-in via SESSIONS_ENABLED. Harness install knobs are
      # code defaults (agent/harnesses/opencode/settings.ts), not env.
      SESSIONS_ENABLED: ${SESSIONS_ENABLED:-false}
      AGENT_HARNESS: ${AGENT_HARNESS:-opencode}
    volumes:
      # ------------------------------------------------------------------
      # Repo entrypoint: host path → container MAIN_REPO_PATH
      # Must be a real absolute path (export HOST_REPO or runner-core/.env).
      # ------------------------------------------------------------------
      # NOTE: Compose default syntax is ${VAR:-default} (colon + dash). A bare
      # ${VAR:/path} expands wrong and becomes ":/app/main_repo" → podman-compose
      # error: "unknown mount option /app/main_repo".
      - ${HOST_REPO:?Set HOST_REPO to an absolute path of a local git repo}:/app/main_repo
      # Agent worktrees (do not bind-mount over the host repo)
      - dev-workspaces:/app/workspaces
      # Persist managed OpenCode install across container recreates
      - dev-opencode:/app/.opencode
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      # Managed OpenCode may npm-install on first boot.
      start_period: 120s

volumes:
  dev-workspaces:
  dev-opencode:
