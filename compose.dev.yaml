# Local dev: open-core + VFS.
#
# Usage:
#   1. Optional — bind a host git checkout:
#        export HOST_REPO=/Users/you/Developer/src/github.com/org/my-repo
#      Omit HOST_REPO to use a Docker volume and the setup page (pair + GitHub).
#   2. Optional secrets / overrides in runner-core/.env (auto-loaded if present):
#        AGENT_PROVIDER, AGENT_API_KEY, …
#   3. Start:
#        docker compose -f compose.yaml -f compose.dev.yaml up --build dev
#   4. Probe:
#        curl -s http://127.0.0.1:18080/health | jq .
#        open http://127.0.0.1:18080/     (setup / pairing)
#   5. iPad / Simulator Base URL:
#        http://127.0.0.1:18080          (Simulator)
#        http://<Mac-LAN-IP>:18080       (physical iPad)
#
# Notes:
#   - HOST_REPO is optional. Unset → named volume `dev-main-repo`.
#   - If HOST_REPO is set, it must be an absolute path to a git repo.
#   - One runner instance = one repo (MAIN_REPO_PATH=/app/main_repo).
#   - Agent worktrees use /app/workspaces (separate volume).
#   - Stop: docker compose -f compose.yaml -f compose.dev.yaml down

services:
  dev:
    build:
      context: .
      target: smoke
    ports:
      - "${DEV_PORT:-18080}:8080"
    # Pass through root .env without re-listing every key in `environment`.
    # Keys also listed under `environment` below win on conflict.
    env_file:
      - path: .env
        required: false
    environment:
      # ── Fixed for this compose layout (not optional) ──────────
      HELM_MODE: open-core
      HOST: 0.0.0.0
      PORT: "8080"
      VFS_ENABLED: "true"
      MAIN_REPO_PATH: /app/main_repo
      WORKSPACES_PATH: /app/workspaces

      # ── Dev defaults that differ from config.ts / image ───────
      # Terminal on for iPad WebSSH; code default is false (quiet tests).
      TERMINAL_ENABLED: ${TERMINAL_ENABLED:-true}
      TERMINAL_WORKDIR: /app/main_repo

      # Sessions stay off until the app PUT /v1/agent (Update). Env is only a
      # CI bootstrap when agent.json is missing. Harness install knobs are
      # catalog defaults + overlays, not env.
      SESSIONS_ENABLED: ${SESSIONS_ENABLED:-false}
      AGENT_HARNESS: ${AGENT_HARNESS:-opencode}
      # Empty MAIN_REPO unless HOST_REPO is set (setup page clones).
      SEED_GIT_FIXTURE: ${SEED_GIT_FIXTURE:-false}
    volumes:
      # Repo: bind HOST_REPO if set, else named volume (setup page clones here).
      # ${VAR:-name} — empty HOST_REPO must not become ":/app/main_repo".
      - ${HOST_REPO:-dev-main-repo}:/app/main_repo
      # Agent worktrees + Helm session JSON (`workspaces/.sessions`)
      - dev-workspaces:/app/workspaces
      # Persist managed harness installs across container recreates
      - dev-opencode:/app/.opencode
      - dev-helm-harnesses:/app/.helm
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      # Managed OpenCode may npm-install on first boot.
      start_period: 120s

volumes:
  dev-main-repo:
  dev-workspaces:
  dev-opencode:
  dev-helm-harnesses:
