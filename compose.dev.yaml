# Local dev: open-core + VFS against a **host** git checkout.
#
# Usage:
#   1. REQUIRED — set a real host git checkout (absolute path):
#        export HOST_REPO=/Users/you/Developer/src/github.com/org/my-repo
#      or put HOST_REPO=... in runner-core/.env
#   2. Start:
#        docker compose -f compose.yaml -f compose.dev.yaml up --build dev
#   3. Probe:
#        curl -s http://127.0.0.1:18080/health | jq .
#        curl -s http://127.0.0.1:18080/v1/vfs/status | jq .
#   4. iPad / Simulator Base URL:
#        http://127.0.0.1:18080          (Simulator)
#        http://<Mac-LAN-IP>:18080       (physical iPad)
#
# Notes:
#   - HOST_REPO is required. The placeholder path is not valid and will fail mount.
#   - HOST_REPO must be a git repo (contains .git).
#   - One runner instance = one repo (MAIN_REPO_PATH=/app/main_repo).
#   - Agent worktrees use a separate volume (/app/workspaces), not the host mount.
#   - Optional: OPENCORE_API_TOKEN, LLM_*, GITHUB_TOKEN via env or a root .env file.
#   - Stop: docker compose -f compose.yaml -f compose.dev.yaml down

services:
  dev:
    build:
      context: .
      target: smoke
    ports:
      - "${DEV_PORT:-18080}:8080"
    environment:
      HELM_MODE: open-core
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      VFS_ENABLED: "true"
      MAIN_REPO_PATH: /app/main_repo
      WORKSPACES_PATH: /app/workspaces
      # Optional IDE label (else derived from git origin, else basename main_repo):
      # VFS_PROJECT_NAME: my-app
      VFS_PROJECT_NAME: ${VFS_PROJECT_NAME:-}
      # Leave empty for unauthenticated local testing (match iPad Open Project token if set).
      OPENCORE_API_TOKEN: ${OPENCORE_API_TOKEN:-}
      # Real GitHub PAT for fetch/push only. Do NOT use a dummy value — a fake token
      # injects a bad Authorization header and breaks git with "terminal prompts disabled".
      # Prefer runner-core/.env: GITHUB_TOKEN=ghp_…  (or per-task agent/run.githubToken).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-local-dev-token}
      # LLM_* must be valid strings (empty "" fails Zod — defaults only apply when unset).
      # Without LLM_API_KEY the agent applies no patches; VFS / health still work.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      GIT_USER_NAME: ${GIT_USER_NAME:-HelmCode Agent}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-agent@helmcode.app}
      DEFAULT_BASE_BRANCH: ${DEFAULT_BASE_BRANCH:-main}
    volumes:
      # ------------------------------------------------------------------
      # Repo entrypoint: host path → container MAIN_REPO_PATH
      # Must be a real absolute path (export HOST_REPO or runner-core/.env).
      # ------------------------------------------------------------------
      # NOTE: Compose default syntax is ${VAR:-default} (colon + dash). A bare
      # ${VAR:/path} expands wrong and becomes ":/app/main_repo" → podman-compose
      # error: "unknown mount option /app/main_repo".
      - ${HOST_REPO:?Set HOST_REPO to an absolute path of a local git repo}:/app/main_repo
      # Agent worktrees (do not bind-mount over the host repo)
      - dev-workspaces:/app/workspaces
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  dev-workspaces:
