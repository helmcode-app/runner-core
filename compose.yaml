# Docker-only workflows — host only needs Docker.
#
#   docker compose run --rm test
#   docker compose up smoke
#
# Dev (HOST_REPO optional — omit to clone via the setup page):
#   docker compose -f compose.yaml -f compose.dev.yaml up --build dev

services:
  test:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
    command:
      [
        "sh",
        "-c",
        "npm run typecheck -w @helmcode/runner && npm test -w @helmcode/runner",
      ]

  test-unit:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
    command: ["npm", "run", "test:unit", "-w", "@helmcode/runner"]

  test-integration:
    build:
      context: .
      target: test
    environment:
      NODE_ENV: test
    command: ["npm", "run", "test:integration", "-w", "@helmcode/runner"]

  smoke:
    build:
      context: .
      target: smoke
    ports:
      - "18080:8080"
    environment:
      HELM_MODE: open-core
      HOST: 0.0.0.0
      PORT: "8080"
      LOG_LEVEL: info
      VFS_ENABLED: "true"
      SEED_GIT_FIXTURE: "true"
    volumes:
      - smoke-main:/app/main_repo
      - smoke-ws:/app/workspaces
      - smoke-bare:/app/remote.git
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  smoke-main:
  smoke-ws:
  smoke-bare:
